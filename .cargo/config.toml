[build]
# sccache can be enabled locally or in CI via CARGO_BUILD_RUSTC_WRAPPER=sccache
# Do NOT hardcode it here — jobs that need it install it explicitly.

# Fast linkers are optional local optimizations.
# mold/lld are NOT required — the system default linker works everywhere.
# To use mold locally on Linux: install it, then uncomment the rustflags below.
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
#
# [target.aarch64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[env]
# sccache configuration
SCCACHE_CACHE_SIZE = "10G"
# Cache relative to workspace root (requires Cargo 1.56+)
SCCACHE_DIR = { value = ".sccache", relative = true }

[profile.dev]
# Disable incremental compilation when using sccache (they conflict)
# sccache provides caching across builds; incremental caches within a build
incremental = false
# Use less aggressive debug info for faster builds
debug = 1

[profile.dev.package."*"]
# Build dependencies with light optimization for faster overall builds
opt-level = 1
