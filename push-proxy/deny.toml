# cargo-deny configuration for RustChat push-proxy
# Run: cargo deny check

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack in rsa crate
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387: crypto-bigint constant-time multiplication flaw.
    # Pinned to 0.5.x by aws-sigv4 1.5; patched only in >= 0.7.6 (semver-major
    # that aws-sigv4 does not accept). Used only for AWS SigV4 signing.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
