[package]
name = "push-proxy"
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1.52", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2"] }
yup-oauth2 = { version = "12", features = ["hyper-rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
tower-http = { version = "0.6", features = ["trace"] }
uuid = { version = "1.23", features = ["v4"] }
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# For APNS JWT authentication
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
