name: Docker Build

on:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "push-proxy/**"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
      - ".github/workflows/docker-build-push.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build images
    uses: ./.github/workflows/docker-build-push.yml
    with:
      push: false
      runner: ubuntu-latest
      platforms: linux/amd64
      timeout-minutes: 90
      cache_to: ""
      backend_target: ci-validate
      tags: |
        type=ref,event=pr
        type=sha,format=long
    permissions:
      contents: read
      # The callee's build job declares packages:write (it is shared with the
      # publishing callers). GitHub enforces the call-site permissions as a
      # hard ceiling for callee job permissions, so this must grant
      # packages:write too or the call fails at startup with an error of the
      # form "The nested job '<job-id>' is requesting 'packages: write', but
      # is only allowed 'packages: none'". Nothing is pushed in this no-push
      # path, so the write scope is never used here.
      packages: write
