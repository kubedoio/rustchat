name: MM-Mobile Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          pip install --require-hashes --no-deps -r tools/mm-compat/requirements.txt
          
      - name: Extract OpenAPI Paths
        run: |
          ./tools/mm-compat/openapi/download_openapi.sh
          python tools/mm-compat/openapi/extract_paths.py
          
      - name: Merge & Diff report
        run: |
          python tools/mm-compat/report/merge_and_diff.py
          
      - name: Archive artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-reports
          path: tools/mm-compat/output/
