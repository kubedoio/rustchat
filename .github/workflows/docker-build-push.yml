name: Docker Build and Push

on:
  workflow_call:
    inputs:
      push:
        description: 'Push images to registry'
        type: boolean
        default: true
      tags:
        description: 'Metadata tags (multiline string for docker/metadata-action)'
        type: string
        default: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
      timeout-minutes:
        description: 'Job timeout in minutes'
        type: number
        default: 90
      runner:
        description: 'GitHub runner label to run the job on'
        type: string
        default: 'ubuntu-latest'
      platforms:
        description: 'Platforms to build for (comma-separated list)'
        type: string
        default: 'linux/amd64'
      cache_to:
        description: 'Cache export target for docker/build-push-action'
        type: string
        default: 'type=gha,mode=max'
      backend_target:
        description: 'Optional Docker target for the backend image'
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: docker/backend.Dockerfile
            image_suffix: -backend
          - service: frontend
            context: ./frontend
            dockerfile: docker/frontend.Dockerfile
            image_suffix: -frontend
          - service: push-proxy
            context: ./push-proxy
            dockerfile: push-proxy/Dockerfile
            image_suffix: -push-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        if: ${{ !contains(inputs.runner, 'self-hosted') }}
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to the Container registry
        if: ${{ inputs.push }}
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: ${{ inputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.service == 'backend' && inputs.backend_target || '' }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ inputs.cache_to }}
