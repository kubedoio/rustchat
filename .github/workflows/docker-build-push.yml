name: Docker Build and Push

on:
  workflow_call:
    inputs:
      push:
        description: 'Push images to registry'
        type: boolean
        default: true
      tags:
        description: 'Metadata tags (multiline string for docker/metadata-action)'
        type: string
        default: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
      timeout-minutes:
        description: 'Job timeout in minutes'
        type: number
        default: 90
      runner:
        description: 'GitHub runner label to run the job on'
        type: string
        default: 'ubuntu-latest'
      platforms:
        description: 'Platforms to build for (comma-separated list)'
        type: string
        default: 'linux/amd64'
      cache_to:
        description: 'Cache export target for docker/build-push-action'
        type: string
        default: 'type=gha,mode=max'
      backend_target:
        description: 'Optional Docker target for the backend image'
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: docker/backend.Dockerfile
            image_suffix: -backend
          - service: frontend
            context: ./frontend
            dockerfile: docker/frontend.Dockerfile
            image_suffix: -frontend
          - service: push-proxy
            context: ./push-proxy
            dockerfile: push-proxy/Dockerfile
            image_suffix: -push-proxy

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        if: ${{ !contains(inputs.runner, 'self-hosted') }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Ensure Docker socket access
        if: ${{ contains(inputs.runner, 'self-hosted') }}
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v sudo >/dev/null 2>&1; then
            echo "Docker is installed, but the runner user cannot access /var/run/docker.sock and sudo is unavailable."
            exit 1
          fi
          if command -v setfacl >/dev/null 2>&1; then
            sudo setfacl -m "u:$(id -un):rw" /var/run/docker.sock
          else
            sudo chmod 666 /var/run/docker.sock
          fi
          docker info >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to the Container registry
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: ${{ inputs.tags }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.service == 'backend' && inputs.backend_target || '' }}
          push: ${{ inputs.push }}
          platforms: ${{ inputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: ${{ inputs.cache_to }}
