name: Docker Publish

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub runner label to run the job on'
        type: string
        default: 'ubuntu-latest'
      platforms:
        description: 'Platforms to build for (comma-separated list)'
        type: string
        default: 'linux/amd64'

jobs:
  # Diagnostic (non-promoted) images.
  #
  # On every push to `main` this builds and publishes immutable, SHA-scoped
  # diagnostic images. These are NOT moving aliases and are clearly
  # non-promoted: users must not treat a commit-SHA image as "the healthy main".
  #
  # Moving development aliases (`main`, `nightly`, `nightly-*`) are advanced
  # only by the separate `promote.yml` workflow after the promotion gate is
  # satisfied for the exact commit (RI-C03).
  build-and-push:
    uses: ./.github/workflows/docker-build-push.yml
    with:
      push: true
      runner: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-latest' }}
      platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64' }}
      timeout-minutes: 120
      tags: |
        type=sha,format=long
    permissions:
      contents: read
      packages: write
