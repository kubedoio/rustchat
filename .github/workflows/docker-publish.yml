name: Docker Publish

on:
  push:
    branches: ["main"]
    tags: ['v*.*.*']

jobs:
  build-and-push:
    uses: ./.github/workflows/docker-build-push.yml
    with:
      push: true
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=ref,event=branch
        type=ref,event=pr
        type=sha,format=long
    permissions:
      contents: read
      packages: write
