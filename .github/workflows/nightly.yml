name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  nightly-tag:
    name: Generate nightly tag
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.NIGHTLY_TAG }}
    steps:
      - name: Generate tag
        id: tag
        run: |
          DATE="$(date +%Y%m%d)"
          SHA="${GITHUB_SHA::7}"
          echo "NIGHTLY_TAG=nightly-${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push nightly images
    needs: nightly-tag
    uses: ./.github/workflows/docker-build-push.yml
    with:
      push: true
      platforms: linux/amd64,linux/arm64
      timeout-minutes: 90
      tags: |
        type=raw,value=nightly
        type=raw,value=${{ needs.nightly-tag.outputs.tag }}
    permissions:
      contents: read
      packages: write
