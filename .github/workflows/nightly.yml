name: Nightly

# Scheduled full CI on `main`.
#
# Moving development aliases (`main`, `nightly`, `nightly-*`) are no longer
# published here. They are advanced by `.github/workflows/promote.yml` only
# after the promotion gate is satisfied for the exact commit (RI-C03). This
# keeps a scheduled full CI run without a competing moving-alias publisher.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
