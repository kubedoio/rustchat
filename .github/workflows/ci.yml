name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub runner label to run the jobs on'
        type: string
        default: 'self-hosted'
  workflow_call:
    inputs:
      runner:
        description: 'GitHub runner label to run the jobs on'
        type: string
        default: 'self-hosted'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      push-proxy: ${{ steps.filter.outputs.push-proxy }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'docker/backend.Dockerfile'
              - 'docker/backend.Dockerfile.*'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'docker/frontend.Dockerfile'
            docker:
              - 'docker/**'
              - 'docker-compose.yml'
              - 'push-proxy/Dockerfile'
              - '.github/workflows/ci.yml'
            push-proxy:
              - 'push-proxy/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'

  backend-check:
    name: Backend Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.scripts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DATABASE_URL: postgres://rustchat:rustchat@localhost:5433/rustchat
      RUSTCHAT_TEST_DATABASE_URL: postgres://rustchat:rustchat@localhost:5433/rustchat
      RUSTCHAT_TEST_REDIS_URL: redis://localhost:6380/
      RUSTCHAT_S3_ENDPOINT: http://localhost:9010
      RUSTCHAT_S3_BUCKET: test-bucket
      RUSTCHAT_S3_ACCESS_KEY: testaccesskey
      RUSTCHAT_S3_SECRET_KEY: testsecretkey
      RUSTCHAT_S3_REGION: us-east-1
      RUSTCHAT_JWT_SECRET: test-jwt-secret-min-32-chars-long
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pull Docker images with retry
        run: |
          for image in pgvector/pgvector:pg16 redis:7 rustfs/rustfs:latest; do
            for i in 1 2 3; do
              echo "Pulling $image (attempt $i)..."
              if docker pull "$image"; then
                break
              fi
              sleep 10
            done
          done

      - name: Start backend service dependencies
        run: |
          docker run -d --name rustchat-ci-postgres \
            -e POSTGRES_USER=rustchat \
            -e POSTGRES_PASSWORD=rustchat \
            -e POSTGRES_DB=rustchat \
            -p 5433:5432 \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            pgvector/pgvector:pg16
          docker run -d --name rustchat-ci-redis \
            -p 6380:6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            redis:7
          docker run -d --name rustchat-ci-rustfs \
            -e RUSTFS_ACCESS_KEY=testaccesskey \
            -e RUSTFS_SECRET_KEY=testsecretkey \
            -p 9010:9000 \
            rustfs/rustfs:latest

      - name: Wait for backend service dependencies
        run: |
          for service in rustchat-ci-postgres rustchat-ci-redis; do
            for i in {1..30}; do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$service")"
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi
              if [ "$i" = 30 ]; then
                docker logs "$service"
                exit 1
              fi
              sleep 2
            done
          done

          for i in {1..60}; do
            if curl -fsS "${RUSTCHAT_S3_ENDPOINT}/health" >/dev/null 2>&1; then
              echo "RustFS is ready"
              break
            fi
            if [ "$i" = 60 ]; then
              docker logs rustchat-ci-rustfs
              exit 1
            fi
            sleep 1
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache sqlx-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install SQLx CLI
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: sqlx-cli

      - name: Run migrations
        working-directory: ./backend
        run: sqlx migrate run

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        working-directory: ./backend
        run: cargo test --lib --no-fail-fast -- --nocapture

      - name: Stop backend service dependencies
        if: always()
        run: docker rm -f rustchat-ci-postgres rustchat-ci-redis rustchat-ci-rustfs

  frontend-check:
    name: Frontend Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate dependency policy
        run: npm run check:dependency-policy

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check "src/**/*.{js,ts,vue,css,json}"

      - name: Run ESLint
        run: npx eslint .

      - name: Apply dependency patches
        run: npm run apply:dependency-patches

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Generate dependency inventory
        run: npm run deps:inventory > dependency-inventory.json

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dependency-inventory
          path: frontend/dependency-inventory.json
          if-no-files-found: ignore

  p0-gates:
    name: P0 Production-Readiness Gates
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run P0 production-readiness gates
        run: scripts/check-p0-gates.sh

  push-proxy-check:
    name: Push Proxy Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.push-proxy == 'true' }}
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: push-proxy

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Cache cargo build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: push-proxy/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --no-fail-fast -- --nocapture

      - name: Build release
        run: cargo build --release

  docker-validate:
    name: Docker Validate
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create dummy .env for docker compose validation
        run: |
          echo "RUSTCHAT_JWT_SECRET=$(openssl rand -hex 32)" > .env
          echo "RUSTCHAT_JWT_ISSUER=dummy-issuer" >> .env
          echo "RUSTCHAT_JWT_AUDIENCE=dummy-audience" >> .env
          echo "RUSTCHAT_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> .env
          echo "RUSTCHAT_S3_ACCESS_KEY=dummy-s3-access-key" >> .env
          echo "RUSTCHAT_S3_SECRET_KEY=dummy-s3-secret-key" >> .env
          echo "RUSTFS_ACCESS_KEY=dummy-rustfs-access-key" >> .env
          echo "RUSTFS_SECRET_KEY=dummy-rustfs-secret-key" >> .env
          echo "PUSH_PROXY_AUTH_KEY=$(openssl rand -hex 32)" >> .env

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Dry-run backend Docker build
        run: docker build -f docker/backend.Dockerfile --target ci-validate backend/

      - name: Dry-run frontend Docker build
        run: docker build -f docker/frontend.Dockerfile frontend/

      - name: Dry-run push-proxy Docker build
        run: docker build -f push-proxy/Dockerfile push-proxy/

  frontend-e2e:
    name: Frontend E2E Tests
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply dependency patches
        run: npm run apply:dependency-patches

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e -- e2e/auth.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  build-release:
    name: Build Release
    needs: [detect-changes, backend-check]
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.scripts == 'true' }}
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-release-target-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build backend release
        working-directory: ./backend
        run: cargo build --release

  # ============ Status Check Aggregator ============
  # This job always runs so branch protection can require a single stable
  # check name regardless of which individual jobs are conditionally skipped.

  ci-complete:
    name: CI Complete
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    needs: [detect-changes, p0-gates, backend-check, frontend-check, frontend-e2e, push-proxy-check, docker-validate, build-release]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check change detection
        if: needs.detect-changes.result == 'failure'
        run: echo "Change detection failed" >&2 && exit 1

      - name: Verify all checks passed
        env:
          P0_GATES_RESULT: ${{ needs.p0-gates.result }}
          BACKEND_CHECK_RESULT: ${{ needs.backend-check.result }}
          FRONTEND_CHECK_RESULT: ${{ needs.frontend-check.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          PUSH_PROXY_CHECK_RESULT: ${{ needs.push-proxy-check.result }}
          DOCKER_VALIDATE_RESULT: ${{ needs.docker-validate.result }}
          BUILD_RELEASE_RESULT: ${{ needs.build-release.result }}
        run: |
          for job in P0_GATES BACKEND_CHECK FRONTEND_CHECK FRONTEND_E2E PUSH_PROXY_CHECK DOCKER_VALIDATE BUILD_RELEASE; do
            result_var="${job}_RESULT"
            result="${!result_var}"
            echo "$job: $result"
            if [ "$result" = "failure" ]; then
              echo "$job failed" >&2
              exit 1
            fi
          done
          echo "All checks passed or were skipped."
