name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub runner label to run the jobs on'
        type: string
        default: 'self-hosted'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      push-proxy: ${{ steps.filter.outputs.push-proxy }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'docker/backend.Dockerfile'
              - 'docker/backend.Dockerfile.*'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'docker/frontend.Dockerfile'
            docker:
              - 'docker/**'
              - 'docker-compose.yml'
              - 'push-proxy/Dockerfile'
              - '.github/workflows/ci.yml'
            push-proxy:
              - 'push-proxy/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'

  backend-check:
    name: Backend Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.scripts == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rustchat
          POSTGRES_PASSWORD: rustchat
          POSTGRES_DB: rustchat
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: testaccesskey
          RUSTFS_SECRET_KEY: testsecretkey
        ports:
          - 9000:9000

    env:
      DATABASE_URL: postgres://rustchat:rustchat@localhost:5432/rustchat
      RUSTCHAT_TEST_DATABASE_URL: postgres://rustchat:rustchat@localhost:5432/rustchat
      RUSTCHAT_TEST_REDIS_URL: redis://localhost:6379/
      RUSTCHAT_S3_ENDPOINT: http://localhost:9000
      RUSTCHAT_S3_BUCKET: test-bucket
      RUSTCHAT_S3_ACCESS_KEY: testaccesskey
      RUSTCHAT_S3_SECRET_KEY: testsecretkey
      RUSTCHAT_S3_REGION: us-east-1
      RUSTCHAT_JWT_SECRET: test-jwt-secret-min-32-chars-long
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo build target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache sqlx-cli
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install SQLx CLI
        run: |
          if ! command -v sqlx &> /dev/null; then
            export PATH="$HOME/.cargo/bin:$PATH"
            if ! command -v cargo-binstall &> /dev/null; then
              curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
            fi
            cargo binstall --locked --no-confirm sqlx-cli --no-default-features --features postgres
          fi

      - name: Wait for RustFS
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1; then
              echo "RustFS is ready"
              break
            fi
            sleep 1
          done

      - name: Run migrations
        working-directory: ./backend
        run: sqlx migrate run

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        working-directory: ./backend
        run: cargo test --lib --no-fail-fast -- --nocapture

  frontend-check:
    name: Frontend Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate dependency policy
        run: npm run check:dependency-policy

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check "src/**/*.{js,ts,vue,css,json}"

      - name: Run ESLint
        run: npx eslint .

      - name: Apply dependency patches
        run: npm run apply:dependency-patches

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Generate dependency inventory
        run: npm run deps:inventory > dependency-inventory.json

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dependency-inventory
          path: frontend/dependency-inventory.json
          if-no-files-found: ignore

  push-proxy-check:
    name: Push Proxy Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.push-proxy == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: push-proxy

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Cache cargo build target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: push-proxy/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --no-fail-fast -- --nocapture

      - name: Build release
        run: cargo build --release

  docker-validate:
    name: Docker Validate
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docker == 'true' }}
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create dummy .env for docker compose validation
        run: |
          echo "RUSTCHAT_JWT_SECRET=$(openssl rand -hex 32)" > .env
          echo "RUSTCHAT_JWT_ISSUER=dummy-issuer" >> .env
          echo "RUSTCHAT_JWT_AUDIENCE=dummy-audience" >> .env
          echo "RUSTCHAT_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> .env
          echo "RUSTCHAT_S3_ACCESS_KEY=dummy-s3-access-key" >> .env
          echo "RUSTCHAT_S3_SECRET_KEY=dummy-s3-secret-key" >> .env
          echo "RUSTFS_ACCESS_KEY=dummy-rustfs-access-key" >> .env
          echo "RUSTFS_SECRET_KEY=dummy-rustfs-secret-key" >> .env

      - name: Validate docker-compose.yml
        run: sudo docker compose config

      - name: Dry-run backend Docker build
        run: sudo docker build -f docker/backend.Dockerfile --target builder backend/

      - name: Dry-run frontend Docker build
        run: sudo docker build -f docker/frontend.Dockerfile frontend/

      - name: Dry-run push-proxy Docker build
        run: sudo docker build -f push-proxy/Dockerfile push-proxy/

  frontend-e2e:
    name: Frontend E2E Tests
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply dependency patches
        run: npm run apply:dependency-patches

      - name: Install Playwright browsers
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            npx playwright install --with-deps
          else
            npx playwright install
          fi

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  build-release:
    name: Build Release
    needs: backend-check
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.scripts == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 40

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo build target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-release-target-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build backend release
        working-directory: ./backend
        run: cargo build --release

  # ============ Status Check Aggregator ============
  # This job always runs so branch protection can require a single stable
  # check name regardless of which individual jobs are conditionally skipped.

  ci-complete:
    name: CI Complete
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: [detect-changes, backend-check, frontend-check, frontend-e2e, push-proxy-check, docker-validate, build-release]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check change detection
        if: needs.detect-changes.result == 'failure'
        run: echo "Change detection failed" >&2 && exit 1

      - name: Verify all checks passed
        run: |
          for job in backend-check frontend-check frontend-e2e push-proxy-check docker-validate build-release; do
            result="${{ needs[job].result }}"
            echo "$job: $result"
            if [ "$result" = "failure" ]; then
              echo "$job failed" >&2
              exit 1
            fi
          done
          echo "All checks passed or were skipped."
