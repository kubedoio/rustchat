name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'GitHub runner label to run the jobs on'
        type: string
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      runner:
        description: 'GitHub runner label to run the jobs on'
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      push-proxy: ${{ steps.filter.outputs.push-proxy }}
      scripts: ${{ steps.filter.outputs.scripts }}
      migrations: ${{ steps.filter.outputs.migrations }}
      backup: ${{ steps.filter.outputs.backup }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - 'docker/backend.Dockerfile'
              - 'docker/backend.Dockerfile.*'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
              - 'docker/frontend.Dockerfile'
            docker:
              - 'docker/**'
              - 'docker-compose.yml'
              - 'push-proxy/Dockerfile'
              - '.github/workflows/ci.yml'
            push-proxy:
              - 'push-proxy/**'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
            migrations:
              - 'backend/migrations/**'
              - 'scripts/migration-matrix.sh'
              - '.github/workflows/ci.yml'
            backup:
              - 'backend/migrations/**'
              - 'scripts/backup-restore-check.sh'
              - '.github/workflows/ci.yml'

  backend-check:
    name: Backend Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.scripts == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60

    env:
      DATABASE_URL: postgres://rustchat:rustchat@localhost:5433/rustchat
      RUSTCHAT_TEST_DATABASE_URL: postgres://rustchat:rustchat@localhost:5433/rustchat
      RUSTCHAT_TEST_REDIS_URL: redis://localhost:6380/
      RUSTCHAT_S3_ENDPOINT: http://localhost:9010
      RUSTCHAT_S3_BUCKET: test-bucket
      RUSTCHAT_S3_ACCESS_KEY: testaccesskey
      RUSTCHAT_S3_SECRET_KEY: testsecretkey
      RUSTCHAT_S3_REGION: us-east-1
      RUSTCHAT_JWT_SECRET: test-jwt-secret-min-32-chars-long
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pull Docker images with retry
        run: |
          for image in pgvector/pgvector:pg16 redis:7 rustfs/rustfs:latest; do
            for i in 1 2 3; do
              echo "Pulling $image (attempt $i)..."
              if docker pull "$image"; then
                break
              fi
              sleep 10
            done
          done

      - name: Start backend service dependencies
        run: |
          docker run -d --name rustchat-ci-postgres \
            -e POSTGRES_USER=rustchat \
            -e POSTGRES_PASSWORD=rustchat \
            -e POSTGRES_DB=rustchat \
            -p 5433:5432 \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            pgvector/pgvector:pg16
          docker run -d --name rustchat-ci-redis \
            -p 6380:6379 \
            --health-cmd "redis-cli ping" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            redis:7
          docker run -d --name rustchat-ci-rustfs \
            -e RUSTFS_ACCESS_KEY=testaccesskey \
            -e RUSTFS_SECRET_KEY=testsecretkey \
            -p 9010:9000 \
            rustfs/rustfs:latest

      - name: Wait for backend service dependencies
        run: |
          for service in rustchat-ci-postgres rustchat-ci-redis; do
            for i in {1..30}; do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$service")"
              if [ "$status" = "healthy" ]; then
                echo "$service is healthy"
                break
              fi
              if [ "$i" = 30 ]; then
                docker logs "$service"
                exit 1
              fi
              sleep 2
            done
          done

          for i in {1..60}; do
            if curl -fsS "${RUSTCHAT_S3_ENDPOINT}/health" >/dev/null 2>&1; then
              echo "RustFS is ready"
              break
            fi
            if [ "$i" = 60 ]; then
              docker logs rustchat-ci-rustfs
              exit 1
            fi
            sleep 1
          done

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache sqlx-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-${{ hashFiles('backend/Cargo.lock') }}

      - name: Install SQLx CLI
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: sqlx-cli

      - name: Run migrations
        working-directory: ./backend
        run: sqlx migrate run

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        working-directory: ./backend
        run: cargo test --lib --no-fail-fast -- --nocapture

      - name: Stop backend service dependencies
        if: always()
        run: docker rm -f rustchat-ci-postgres rustchat-ci-redis rustchat-ci-rustfs

  frontend-check:
    name: Frontend Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate dependency policy
        run: npm run check:dependency-policy

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check "src/**/*.{js,ts,vue,css,json}"

      - name: Run ESLint
        run: npx eslint .

      - name: Apply dependency patches
        run: npm run apply:dependency-patches

      - name: Run unit tests
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

      - name: Generate dependency inventory
        run: npm run deps:inventory > dependency-inventory.json

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dependency-inventory
          path: frontend/dependency-inventory.json
          if-no-files-found: ignore

  security-regression-guards:
    name: Security Regression Guards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run security regression guards
        run: scripts/check-p0-gates.sh

      - name: Run gate propagation tests
        run: scripts/test-gate-propagation.sh

  push-proxy-check:
    name: Push Proxy Check
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.push-proxy == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: push-proxy

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Cache cargo build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: push-proxy/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('push-proxy/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --no-fail-fast -- --nocapture

      - name: Build release
        run: cargo build --release

  docker-validate:
    name: Docker Validate
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create dummy .env for docker compose validation
        run: |
          {
            echo "RUSTCHAT_JWT_SECRET=$(openssl rand -hex 32)"
            echo "RUSTCHAT_JWT_ISSUER=dummy-issuer"
            echo "RUSTCHAT_JWT_AUDIENCE=dummy-audience"
            echo "RUSTCHAT_ENCRYPTION_KEY=$(openssl rand -hex 32)"
            echo "RUSTCHAT_S3_ACCESS_KEY=dummy-s3-access-key"
            echo "RUSTCHAT_S3_SECRET_KEY=dummy-s3-secret-key"
            echo "RUSTFS_ACCESS_KEY=dummy-rustfs-access-key"
            echo "RUSTFS_SECRET_KEY=dummy-rustfs-secret-key"
            echo "PUSH_PROXY_AUTH_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Validate docker-compose.yml
        run: docker compose config

      - name: Dry-run backend Docker build
        run: docker build -f docker/backend.Dockerfile --target ci-validate backend/

      - name: Dry-run frontend Docker build
        run: docker build -f docker/frontend.Dockerfile frontend/

      - name: Dry-run push-proxy Docker build
        run: docker build -f push-proxy/Dockerfile push-proxy/

  frontend-e2e:
    name: Frontend E2E Tests
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply dependency patches
        run: npm run apply:dependency-patches

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e -- e2e/auth.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  build-release:
    name: Build Release
    needs: [detect-changes, backend-check]
    if: ${{ needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.scripts == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9

      - name: Cache cargo build target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-release-target-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build backend release
        working-directory: ./backend
        run: cargo build --release

  # ============ Status Check Aggregator ============
  # This job always runs so branch protection can require a single stable
  # check name regardless of which individual jobs are conditionally skipped.

  repo-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check API persistence boundary (RI-C04)
        run: python3 tools/repository-integrity/check_api_direct_sql.py

      - name: Check module growth control (RI-C05)
        run: python3 tools/repository-integrity/check_module_size.py

  migration-matrix:
    name: Migration Matrix
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.migrations == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Trust auth for the throwaway CI database: no credentials exist
          # to leak (the service is only reachable from the job runner).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history incl. tags: the upgrade path reconstructs the latest
          # published stable schema via git archive of its tag. fetch-tags
          # matters for fork PRs, whose checkouts do not inherit upstream
          # tags created after the fork (origin is the base repo for
          # pull_request events). The script additionally falls back to a
          # pinned commit if the tag is still missing.
          fetch-depth: 0
          fetch-tags: true

      - name: Run migration matrix (RI-C07)
        env:
          PGPORT: "5433"
          PGUSER: postgres
        run: scripts/migration-matrix.sh

  backup-restore:
    name: Backup Restore
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.backup == 'true' }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          # Trust auth for the throwaway CI database: no credentials exist
          # to leak (the service is only reachable from the job runner).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run backup/restore check (P006 recovery evidence)
        env:
          PGPORT: "5433"
          PGUSER: postgres
        run: scripts/backup-restore-check.sh

  ci-complete:
    name: CI Complete
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: [detect-changes, security-regression-guards, backend-check, frontend-check, frontend-e2e, push-proxy-check, docker-validate, build-release, repo-integrity, migration-matrix, backup-restore]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify all CI aggregate members passed
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          SECURITY_REGRESSION_GUARDS_RESULT: ${{ needs.security-regression-guards.result }}
          BACKEND_CHECK_RESULT: ${{ needs.backend-check.result }}
          FRONTEND_CHECK_RESULT: ${{ needs.frontend-check.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          PUSH_PROXY_CHECK_RESULT: ${{ needs.push-proxy-check.result }}
          DOCKER_VALIDATE_RESULT: ${{ needs.docker-validate.result }}
          BUILD_RELEASE_RESULT: ${{ needs.build-release.result }}
          REPO_INTEGRITY_RESULT: ${{ needs.repo-integrity.result }}
          MIGRATION_MATRIX_RESULT: ${{ needs.migration-matrix.result }}
          BACKUP_RESTORE_RESULT: ${{ needs.backup-restore.result }}
        run: >-
          scripts/ci-aggregate.sh
          DETECT_CHANGES_RESULT
          SECURITY_REGRESSION_GUARDS_RESULT
          BACKEND_CHECK_RESULT
          FRONTEND_CHECK_RESULT
          FRONTEND_E2E_RESULT
          PUSH_PROXY_CHECK_RESULT
          DOCKER_VALIDATE_RESULT
          BUILD_RELEASE_RESULT
          REPO_INTEGRITY_RESULT
          MIGRATION_MATRIX_RESULT
          BACKUP_RESTORE_RESULT
