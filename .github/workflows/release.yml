name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${{ steps.version.outputs.VERSION }}"
          if [[ "${file_version}" != "${tag_version}" ]]; then
            echo "ERROR: VERSION file (${file_version}) does not match tag (${tag_version})"
            exit 1
          fi
          echo "VERSION file matches tag: ${tag_version}"

      - name: Verify Cargo.toml version
        run: |
          set -euo pipefail
          cargo_version="$(grep '^version' backend/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')"
          tag_version="${{ steps.version.outputs.VERSION }}"
          if [[ "${cargo_version}" != "${tag_version}" ]]; then
            echo "ERROR: backend/Cargo.toml version (${cargo_version}) does not match tag (${tag_version})"
            exit 1
          fi
          echo "backend/Cargo.toml version matches: ${tag_version}"

      - name: Verify package.json version
        run: |
          set -euo pipefail
          pkg_version="$(grep '"version"' frontend/package.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')"
          tag_version="${{ steps.version.outputs.VERSION }}"
          if [[ "${pkg_version}" != "${tag_version}" ]]; then
            echo "ERROR: frontend/package.json version (${pkg_version}) does not match tag (${tag_version})"
            exit 1
          fi
          echo "frontend/package.json version matches: ${tag_version}"

      - name: Verify CHANGELOG.md has entry
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no entry for [${version}]"
            exit 1
          fi
          echo "CHANGELOG.md has entry for [${version}]"

      - name: Verify CHANGELOG.md has content
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          section=$(awk "/^## \[${version}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md || true)
          if [[ -z "$(echo "${section}" | grep -v '^[[:space:]]*$' || true)" ]]; then
            echo "ERROR: CHANGELOG.md section [${version}] is empty"
            exit 1
          fi
          echo "CHANGELOG.md section [${version}] has content"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          section=$(awk "/^## \[${version}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md || true)
          if [[ -z "${section}" ]]; then
            section="See [CHANGELOG.md](CHANGELOG.md) for release notes."
          fi
          {
            echo "SECTION<<EOF"
            echo "${section}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@c9b05b44a812856d48f4f085543a7253e26b0435 # v2.2.2
        with:
          name: RustChat ${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.SECTION }}

            ## Container Images

            | Image | Tags |
            |-------|------|
            | `ghcr.io/${{ github.repository }}-backend` | `${{ steps.version.outputs.VERSION }}`, `latest` |
            | `ghcr.io/${{ github.repository }}-frontend` | `${{ steps.version.outputs.VERSION }}`, `latest` |
            | `ghcr.io/${{ github.repository }}-push-proxy` | `${{ steps.version.outputs.VERSION }}`, `latest` |

            ## Upgrade Notes

            Before upgrading:
            1. Review the changelog above for breaking changes
            2. Check `.env.example` for new required environment variables
            3. Test in a staging environment before production
            4. Database migrations run automatically on backend startup

            ## Quick Start

            ```bash
            docker pull ghcr.io/${{ github.repository }}-backend:${{ steps.version.outputs.VERSION }}
            docker pull ghcr.io/${{ github.repository }}-frontend:${{ steps.version.outputs.VERSION }}
            docker pull ghcr.io/${{ github.repository }}-push-proxy:${{ steps.version.outputs.VERSION }}
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Build and push release images
    runs-on: ubuntu-latest
    needs: [validate, release]
    if: needs.validate.result == 'success' && needs.release.result == 'success'
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: docker/backend.Dockerfile
            image_suffix: -backend
          - service: frontend
            context: ./frontend
            dockerfile: docker/frontend.Dockerfile
            image_suffix: -frontend
          - service: push-proxy
            context: ./push-proxy
            dockerfile: push-proxy/Dockerfile
            image_suffix: -push-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@2910929f0f4b05c3832b0161f2b7792109d77019 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2320d45b3aecc7843742 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81941eba4e6edf2dcf244 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d66ec6d9855d4b6ac8b82f3f9f91d48 # v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
