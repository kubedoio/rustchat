name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  gate:
    name: Release Gate
    runs-on: ubuntu-latest
    # The gate runs with --wait (bounded 1800s default timeout) because a tag
    # pushed shortly after merge can race required checks that are still
    # running on the tagged commit (e.g. Security/CodeQL). Leave headroom for
    # polling/fetch overhead on top of the wait budget.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify release-gate check set for the exact tagged commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_SHA: ${{ github.sha }}
        run: |
          scripts/promotion-gate.sh \
            --repo "${{ github.repository }}" \
            --sha "${GATE_SHA}" \
            --token "${GITHUB_TOKEN}" \
            --required "CI Complete" \
            --required "Security Complete" \
            --required "dco-check" \
            --required "Backend Integration Tests" \
            --wait

  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches tag
        run: |
          set -euo pipefail
          file_version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${{ steps.version.outputs.VERSION }}"
          if [[ "${file_version}" != "${tag_version}" ]]; then
            echo "ERROR: VERSION file (${file_version}) does not match tag (${tag_version})"
            exit 1
          fi
          echo "VERSION file matches tag: ${tag_version}"

      - name: Verify Cargo.toml version
        run: |
          set -euo pipefail
          cargo_version="$(grep '^version' backend/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')"
          tag_version="${{ steps.version.outputs.VERSION }}"
          if [[ "${cargo_version}" != "${tag_version}" ]]; then
            echo "ERROR: backend/Cargo.toml version (${cargo_version}) does not match tag (${tag_version})"
            exit 1
          fi
          echo "backend/Cargo.toml version matches: ${tag_version}"

      - name: Verify package.json version
        run: |
          set -euo pipefail
          pkg_version="$(grep '"version"' frontend/package.json | head -1 | sed 's/.*: *"\(.*\)".*/\1/')"
          tag_version="${{ steps.version.outputs.VERSION }}"
          if [[ "${pkg_version}" != "${tag_version}" ]]; then
            echo "ERROR: frontend/package.json version (${pkg_version}) does not match tag (${tag_version})"
            exit 1
          fi
          echo "frontend/package.json version matches: ${tag_version}"

      - name: Verify CHANGELOG.md has entry
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md has no entry for [${version}]"
            exit 1
          fi
          echo "CHANGELOG.md has entry for [${version}]"

      - name: Verify CHANGELOG.md has content
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          section=$(awk "/^## \[${version}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md || true)
          if [[ -z "$(echo "${section}" | grep -v '^[[:space:]]*$' || true)" ]]; then
            echo "ERROR: CHANGELOG.md section [${version}] is empty"
            exit 1
          fi
          echo "CHANGELOG.md section [${version}] has content"

  docker-release:
    name: Build and push release images
    needs: [validate, gate]
    uses: ./.github/workflows/docker-build-push.yml
    with:
      push: true
      runner: ubuntu-latest
      platforms: linux/amd64,linux/arm64
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=latest
      timeout-minutes: 120
    permissions:
      contents: read
      packages: write

  image-evidence:
    name: Record image digests and SBOMs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate, gate, docker-release]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Resolves the immutable digest of every published service image and,
      # for stable releases, fails the run on rolling-alias drift (X.Y or
      # latest pointing anywhere but this release's manifest).
      - name: Record image digests and verify alias consistency
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          args=(--prefix "${IMAGE_PREFIX}" --version "${version}" --output "image-digests-${version}.txt")
          if [[ "${version}" != *"-"* ]]; then
            args+=(--enforce-aliases)
          fi
          scripts/record-image-digests.sh "${args[@]}"

      # SPDX SBOMs are generated from the published multi-arch images; syft
      # scans the linux/amd64 variant of each index.
      - name: Generate SBOM (backend)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_PREFIX }}-backend:${{ steps.version.outputs.VERSION }}
          format: spdx-json
          output-file: sbom-backend-${{ steps.version.outputs.VERSION }}.spdx.json
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (frontend)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.version.outputs.VERSION }}
          format: spdx-json
          output-file: sbom-frontend-${{ steps.version.outputs.VERSION }}.spdx.json
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (push-proxy)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_PREFIX }}-push-proxy:${{ steps.version.outputs.VERSION }}
          format: spdx-json
          output-file: sbom-push-proxy-${{ steps.version.outputs.VERSION }}.spdx.json
          upload-artifact: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-evidence
          path: |
            image-digests-*.txt
            sbom-*.spdx.json
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, gate, docker-release, image-evidence]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.VERSION }}"
          section=$(awk "/^## \[${version}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md || true)
          if [[ -z "${section}" ]]; then
            section="See [CHANGELOG.md](CHANGELOG.md) for release notes."
          fi
          {
            echo "SECTION<<EOF"
            echo "${section}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download image evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-evidence
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
          name: RustChat ${{ steps.version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.SECTION }}

            ## Container Images

            | Image | Tags |
            |-------|------|
            | `ghcr.io/${{ github.repository }}-backend` | `${{ steps.version.outputs.VERSION }}`, `latest` |
            | `ghcr.io/${{ github.repository }}-frontend` | `${{ steps.version.outputs.VERSION }}`, `latest` |
            | `ghcr.io/${{ github.repository }}-push-proxy` | `${{ steps.version.outputs.VERSION }}`, `latest` |

            Immutable digests for every published tag and SPDX SBOMs for each
            image are attached to this release (`image-digests-*.txt`,
            `sbom-*.spdx.json`).

            ## Upgrade Notes

            Before upgrading:
            1. Review the changelog above for breaking changes
            2. Check `.env.example` for new required environment variables
            3. Test in a staging environment before production
            4. Database migrations run automatically on backend startup

            ## Quick Start

            ```bash
            docker pull ghcr.io/${{ github.repository }}-backend:${{ steps.version.outputs.VERSION }}
            docker pull ghcr.io/${{ github.repository }}-frontend:${{ steps.version.outputs.VERSION }}
            docker pull ghcr.io/${{ github.repository }}-push-proxy:${{ steps.version.outputs.VERSION }}
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
