worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Writable temp paths so the non-root user can run nginx.
    client_body_temp_path /tmp/nginx/client_body 1 2;
    proxy_temp_path /tmp/nginx/proxy 1 2;
    fastcgi_temp_path /tmp/nginx/fastcgi 1 2;
    uwsgi_temp_path /tmp/nginx/uwsgi 1 2;
    scgi_temp_path /tmp/nginx/scgi 1 2;

    log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                '"$http_user_agent"';

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Logging configuration for debugging
        access_log /var/log/nginx/access.log upstream_logging;
        error_log /var/log/nginx/error.log warn;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Mattermost Mobile requests Calls plugin routes under /plugins/.
        location ^~ /plugins/com.mattermost.calls/ {
            proxy_pass http://backend:3000/api/v4/plugins/com.mattermost.calls/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Explicit routing for Mattermost API v4 compatibility
        location ^~ /api/v4/ {
            proxy_pass http://backend:3000/api/v4/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Important for WebSocket protocol fallback
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # Disable caching for API
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass http://backend:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Important for WebSocket protocol fallback
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # Disable caching for API
            proxy_cache_bypass $http_upgrade;
        }
    }
}
