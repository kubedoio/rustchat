[advisories]
ignore = [
    # rustls-webpki via aws-smithy-http-client → hyper-rustls → rustls 0.21
    # Transitive dependency from AWS SDK. Not directly exploitable by our code.
    # Certificate name constraint / CRL parsing issues in rustls-webpki 0.101.7
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    # rsa crate - side-channel vulnerability in RSA key generation.
    # Affects jsonwebtoken (for JWT verification) and sqlx-mysql (unused - we use PostgreSQL).
    # No fixed upgrade is available. We only verify JWTs, not generate RSA keys.
    "RUSTSEC-2023-0071",
]
