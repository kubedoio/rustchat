[package]
name = "rustchat"
version = "0.5.0-rc.3"
edition = "2021"
rust-version = "1.95"
authors = ["rustchat contributors"]
description = "Self-hosted, enterprise-ready team collaboration platform"
license = "Apache-2.0"
repository = "https://github.com/rustchat/rustchat"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
async-channel = "2.3"

# Web framework
axum = { version = "0.8", features = ["macros", "ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "compression-gzip", "set-header", "catch-panic"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "0.28", features = ["tokio-comp", "json"] }
deadpool-redis = "0.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
flate2 = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = { version = "0.14", features = ["process"] }

# Auth
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
argon2 = "0.5"

# Utils
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
hostname = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2.0"
anyhow = "1.0"
futures-util = "0.3"
regex = "1.10"
dashmap = "6.2"
once_cell = "1.18"
libc = "0.2"
rand = "0.8"
async-trait = "0.1"
handlebars = "5.1"

# S3 Storage
aws-sdk-s3 = { version = "1.133", default-features = false, features = ["behavior-version-latest", "sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-config = { version = "1.8", features = ["behavior-version-latest"] }

# File handling
mime = "0.3"
mime_guess = "2.0"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# HTTP client for OAuth (rustls for musl compatibility)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
urlencoding = "2.1"

# Email
lettre = { version = "0.11.22", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "pool"] }
base64 = "0.22.1"
url = "2.5.8"

# TURN credential generation
hmac = "0.12"
sha1 = "0.10"

# WebRTC for SFU
webrtc = "0.17.1"

# TLS/crypto provider (required for rustls 0.23+)
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rtp = "0.11"
rtcp = "0.12"
sdp = "0.6"
interceptor = "0.12"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "multipart", "rustls-tls"] }
tokio-test = "0.4"
tokio-tungstenite = "0.24"

[[bin]]
name = "rustchat"
path = "src/main.rs"
