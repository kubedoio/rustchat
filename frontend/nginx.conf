worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Writable temp paths so the non-root user can run nginx.
    client_body_temp_path /tmp/nginx/client_body 1 2;
    proxy_temp_path /tmp/nginx/proxy 1 2;
    fastcgi_temp_path /tmp/nginx/fastcgi 1 2;
    uwsgi_temp_path /tmp/nginx/uwsgi 1 2;
    scgi_temp_path /tmp/nginx/scgi 1 2;

    log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                                '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                '"$http_user_agent" '
                                'upstream_addr="$upstream_addr" upstream_status="$upstream_status"';

    server {
        listen 8080;
        server_name localhost;

        client_max_body_size 50m;

        root /usr/share/nginx/html;
        index index.html;

        access_log /var/log/nginx/access.log upstream_logging;

        # Disable caching for index.html (always get fresh version)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";

            # Target Content-Security-Policy, REPORT-ONLY for now (M4).
            # The backend API presets are already enforcing this shape
            # (backend/src/middleware/security_headers.rs); this header
            # brings the policy to the SPA document, which nginx serves.
            # Report-only so the known runtime allowances can be confirmed
            # during a manual admin pass (browser console shows violations):
            #   - https://challenges.cloudflare.com — Turnstile script
            #     (frontend/src/components/auth/TurnstileWidget.vue)
            #   - frame-src https: — embedded call meeting URLs
            #     (frontend/src/components/modals/VideoCallModal.vue)
            # Promote to an enforcing Content-Security-Policy header once a
            # manual pass shows zero violations. frame-ancestors is omitted:
            # it is not supported in report-only mode.
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' blob:; frame-src 'self' https:; base-uri 'self'; form-action 'self';";

            try_files $uri =404;
        }

        # Standard frontend routing
        location / {
            # Same target policy as location = /index.html above (report-only).
            add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https:; media-src 'self' blob:; frame-src 'self' https:; base-uri 'self'; form-action 'self';";

            try_files $uri $uri/ /index.html;
        }

        # High-priority login route to handle the "Token" header casing
        location = /api/v4/users/login {
            proxy_pass http://backend:3000/api/v4/users/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Use Lua ONLY for the header manipulation to ensure case-sensitivity
            header_filter_by_lua_block {
                -- Mattermost mobile requires "Token" (PascalCase)
                local auth_token = ngx.header["token"] or ngx.header["Token"]

                if auth_token then
                    -- Clear both to prevent duplicates
                    ngx.header["token"] = nil
                    ngx.header["Token"] = nil

                    -- Set correctly
                    ngx.header["Token"] = auth_token
                    ngx.header["Access-Control-Expose-Headers"] = "Token"
                end

            }
        }

        # Catch-all for other v4 API calls (includes WebSockets)
        # Mattermost Mobile also requests Calls plugin endpoints under /plugins/.
        location ^~ /plugins/com.mattermost.calls/ {
            proxy_pass http://backend:3000/api/v4/plugins/com.mattermost.calls/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Catch-all for other v4 API calls (includes WebSockets)
        location ^~ /api/v4/ {
            proxy_pass http://backend:3000/api/v4/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Mattermost WS protocol compatibility
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Ensure standard API calls also expose the Token if returned elsewhere
            header_filter_by_lua_block {
                 if ngx.header["token"] then
                    local t = ngx.header["token"]
                    ngx.header["token"] = nil
                    ngx.header["Token"] = t
                    ngx.header["Access-Control-Expose-Headers"] = "Token"
                 end
            }
        }

        # File uploads (disable buffering, allow larger bodies)
        location = /api/v1/files {
            proxy_pass http://backend:3000/api/v1/files;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Legacy or other API paths
        location /api/ {
            proxy_pass http://backend:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
